<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title-home"></title>
    <link rel="stylesheet" href="../CSS/home.css">
</head>

<body>
    <div id="header-part"></div>

    <div class="home-body">
        <div class="promo-part">
            <div class="promo-title">
                <h2 id="promotions"></h2>
            </div>
            <div class="promo-banner">
                <div class="banner1 move-horizontal">
                    <img src="../Asset/Images/Banner/ikea_banner1.webp" alt="Banner1" title="Banner1">
                </div>
                <div class="banner1 move-horizontal">
                    <img src="../Asset/Images/Banner/ikea_banner2.webp" alt="Banner2" title="Banner2">
                </div>
                <a class="btn-prev" onclick="moveBanner(-1,0)">&#x276E;</a>
                <a class="btn-next" onclick="moveBanner(1,0)">&#x276F;</a>
            </div>
        </div>
        <div class="brand-part">
            <div class="brand-title">
                <h2 id="brands"></h2>
            </div>
            <div class="brand-logo">
                <img src="../Asset/Images/Brand/ingka.png" alt="Brand1" title="Brand1">
                <img src="../Asset/Images/Brand/ikano.png" alt="Brand2" title="Brand2">
                <img src="../Asset/Images/Brand/K3.jpg" alt="Brand3" title="Brand3">
                <img src="../Asset/Images/Brand/brand1.png" alt="Brand4" title="Brand4">
                <img src="../Asset/Images/Brand/brand2.png" alt="Brand5" title="Brand5">
                <img src="../Asset/Images/Brand/brand3.png" alt="Brand6" title="Brand6">
                <img src="../Asset/Images/Brand/brand4.png" alt="Brand7" title="Brand7">
            </div>
        </div>
        <div class="product-part">
            <div class="product-title">
                <h2 id="products"></h2>
            </div>
            <div class="product-box">
                <div class="product-card">
                    <img src="../Asset/Images/Furniture/ikea_furniture.webp" alt="Furniture">
                    <p id="furniture"></p>
                </div>
                <div class="product-card">
                    <img src="../Asset/Images/Decoration/ikea_decoration.webp" alt="Decoration">
                    <p id="decoration"></p>
                </div>
                <div class="product-card">
                    <img src="../Asset/Images/Workspace/ikea_workspace.webp" alt="Workspace">
                    <p id="workspace"></p>
                </div>
                <div class="product-card">
                    <img src="../Asset/Images/Outdoor/ikea_outdoor.webp" alt="Outdoor">
                    <p id="outdoor"></p>
                </div>
            </div>
        </div>
        <div class="recommend-part">
            <div class="recommend-title">
                <h2 id="recommended"></h2>
            </div>
            <div class="recommend-banner">
                <div class="banner2 move-horizontal">
                    <img src="../Asset/Images/Banner/ikea_banner3.webp" alt="Banner3" title="Banner3">
                </div>
                <div class="banner2 move-horizontal">
                    <img src="../Asset/Images/Banner/ikea_banner4.webp" alt="Banner4" title="Banner4">
                </div>
                <a class="btn-prev" onclick="moveBanner(-1,1)">&#x276E;</a>
                <a class="btn-next" onclick="moveBanner(1,1)">&#x276F;</a>
            </div>
        </div>
        <div class="overview-part">
            <div class="overview-left">
                <div class="overview-image">
                    <img src="../Asset/Images/Common/Logo-ILKEA.png" alt="ILKEA">
                </div>
            </div>
            <div class="overview-right">
                <div class="overview-text">
                    <p id="short-company-description"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-part"></div>

    <script src="../JS/template.js"></script>
    <script src="../JS/banner.js"></script>
</body>

</html>
