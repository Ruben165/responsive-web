<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title-member"></title>
    <link rel="stylesheet" href="../CSS/member.css">
</head>

<body>
    <div id="header-part"></div>

    <div class="member-body">
        <div class="member-title">
            <h2 id="register"></h2>
        </div>
        <form name="register-member" id="register-member" class="member-form" method="post"
            enctype="multipart/form-data">
            <div class="member-input">
                <label for="member-username" id="username"></label>
                <input type="text" name="member-username" id="member-username" placeholder="Enter your username...">
            </div>
            <div class="member-input">
                <label for="member-gender" id="gender"></label>
                <select name="member-gender" id="member-gender">
                    <option value="" disabled selected id="select-your-gender"></option>
                    <option value="Male" id="male"></option>
                    <option value="Female" id="female"></option>
                </select>
            </div>
            <div class="member-input">
                <label for="member-email" id="email-address"></label>
                <input type="text" name="member-email" id="member-email" placeholder="example@gmail.com">
            </div>
            <div class="member-input">
                <label for="member-phone" id="phone-number"></label>
                <input type="text" name="member-phone" id="member-phone" placeholder="e.g: 08181922560">
            </div>
            <div class="member-input">
                <label for="member-address" id="home-address"></label>
                <textarea name="member-address" id="member-address" placeholder="Enter your home address..."></textarea>
            </div>
            <div class="member-input">
                <label for="member-pass" id="password"></label>
                <input type="password" name="member-pass" id="member-pass" placeholder="Enter your password...">
            </div>
            <div class="member-input">
                <label for="member-cpass" id="confirm-password"></label>
                <input type="password" name="member-cpass" id="member-cpass" placeholder="Repeat your password...">
            </div>
            <div class="member-warning">
                <p id="privacy-info"></p>
            </div>
            <div class="member-input-check">
                <input type="checkbox" name="member-agreeTC" id="member-agreeTC">
                <label for="member-agreeTC">I've read and understood the <span class="certain-term">ILKEA General Terms
                        & Conditions</span>.</label>
            </div>
            <div class="member-input-check">
                <input type="checkbox" name="member-agreeNews" id="member-agreeNews">
                <label for="member-agreeNews" id="update-info"></label>
            </div>
            <div class="member-input">
                <input type="submit" value="Create Account" title="Create Account">
            </div>
            <div class="submit-result" id="submit-result"></div>
            <div class="submit-errors" id="submit-errors"></div>
        </form>
    </div>

    <div id="footer-part"></div>

    <script src="../JS/template.js"></script>
    <script src="../JS/val.js"></script>
</body>

</html>
